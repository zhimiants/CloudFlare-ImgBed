name: Deploy to Cloudflare Workers (PHU)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Worker name"
        required: false
        default: "cloudflare-imgbed"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check PHU deployment config
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PHU }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PHU }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID_PHU }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$KV_NAMESPACE_ID" ]; then
            echo "PHU deployment is not configured. Add CLOUDFLARE_API_TOKEN_PHU, CLOUDFLARE_ACCOUNT_ID_PHU, and KV_NAMESPACE_ID_PHU as Actions secrets."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci --workspace=@cloudflare-imgbed/common --workspace=@cloudflare-imgbed/worker --omit=dev

      - name: Generate worker routes
        if: steps.check.outputs.skip != 'true'
        run: node deploy/worker/generate-routes.js

      - name: Generate Wrangler config
        id: config
        if: steps.check.outputs.skip != 'true'
        env:
          WORKER_NAME: ${{ inputs.worker_name || secrets.WORKER_NAME_PHU }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID_PHU }}
          WORKER_VARS: ${{ secrets.WORKER_VARS_PHU }}
        run: node deploy/worker/generate-toml.js

      - name: Deploy to PHU Cloudflare account
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_PHU }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PHU }}
          wranglerVersion: "4"
          command: deploy --config deploy/worker/wrangler.toml

      - name: Upload PHU Worker secrets
        if: steps.check.outputs.skip != 'true' && steps.config.outputs.has_secrets == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_PHU }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PHU }}
          wranglerVersion: "4"
          command: secret bulk "${{ steps.config.outputs.secrets_path }}" --config deploy/worker/wrangler.toml

      - name: Clean up PHU Worker secrets file
        if: always() && steps.config.outputs.has_secrets == 'true'
        env:
          WORKER_SECRETS_FILE: ${{ steps.config.outputs.secrets_path }}
        run: rm -f -- "$WORKER_SECRETS_FILE"
